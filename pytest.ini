[pytest]
# Pytest configuration for SpectraTact
testpaths = test/backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
minversion = 6.0

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interaction
    config: Configuration validation tests
    windows: Tests requiring Windows-specific APIs
    slow: Tests that take more than a few seconds
    network: Tests that require network connectivity
    filesystem: Tests that interact with the file system
    mock: Tests that use extensive mocking

# Test execution options
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:websockets.*
    ignore::ResourceWarning
