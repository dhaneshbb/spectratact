#================================================================================
# SETTINGS (Optional)
#================================================================================

# Optional settings section for metadata and organization
settings:
  # Directory where application shortcuts are stored
  apps_directory: "C:\\Apps"

  # Categories for organization (not used by core functionality)
  categories:
    - "productivity"
    - "communication"
    - "development"
    - "design"

#================================================================================
# TIPS AND BEST PRACTICES
#================================================================================

# 1. KEYWORD SELECTION:
#    - Use specific keywords to avoid false matches
#    - Include domain names for web applications
#    - Test keywords by checking window titles
#    - More keywords = better detection reliability

# 2. PROFILE NAMING:
#    - Use descriptive profile names (Work, Personal, Project1, etc.)
#    - Keep names consistent across applications
#    - Profile names are displayed in the UI

# 3. APP PATHS:
#    - Always use .lnk (Windows shortcut) files
#    - Use absolute paths (C:\\..., D:\\..., etc.)
#    - Use double backslashes (\\) in Windows paths
#    - Test shortcuts manually before adding

# 4. ORGANIZING PROFILES:
#    - Group related profiles together
#    - Use consistent naming conventions
#    - Document special configurations with comments

# 5. LOADING PROFILES:
#    - Use GUI: Load Apps panel → Select profiles → Load Selected
#    - Manual: Copy profile entries to loaded_apps.yml
#    - Profiles must be in loaded_apps.yml to be launched

# 6. MAINTENANCE:
#    - Keep this file as the master list
#    - Add new applications here first
#    - Remove obsolete applications periodically
#    - Update paths if applications move

#================================================================================
# TROUBLESHOOTING
#================================================================================

# Issue: Windows not detected
# Solution: Check keywords against actual window titles
#          Add more specific keywords
#          Verify target_detection settings in settings.yml

# Issue: Application won't launch
# Solution: Verify .lnk file path exists
#          Test shortcut manually
#          Check file permissions
#          Ensure path uses double backslashes

# Issue: Multiple profiles loading
# Solution: Check loaded_apps.yml for duplicates
#          Unload unwanted profiles via GUI
#          Verify unique profile names

# Issue: Wrong window detected
# Solution: Make keywords more specific
#          Remove generic keywords
#          Add domain-specific keywords
